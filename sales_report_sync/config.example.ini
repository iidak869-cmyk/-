; このファイルを config.ini という名前でコピーして値を設定してください。
; config.ini はパスワードを含むためGitへはコミットしないこと(.gitignore済み)。

[houkokkun]
; ほうこっくんのログインページURL
url = https://example.houkokkun.jp/
login_id = YOUR_LOGIN_ID
password = YOUR_PASSWORD
; ブラウザを画面に表示せず実行する(動作確認時は false にすると画面が見える)
headless = true
; 画面表示の待ち時間(秒)。回線が遅い場合は増やす
wait_seconds = 15

[excel]
; 営業報告データベースExcelのフルパス
path = C:\data\営業報告データベース.xlsx
; シート名(空欄なら先頭のシートを使用)
sheet_name =

[google_sheets]
; 転記先スプレッドシートのID(URLの /d/ と /edit の間の文字列)
spreadsheet_id = YOUR_SPREADSHEET_ID
; 転記先のシート名(空欄なら先頭のシート)
worksheet_name =
; Googleサービスアカウントの鍵ファイル(JSON)のフルパス
service_account_json = C:\data\service_account.json
